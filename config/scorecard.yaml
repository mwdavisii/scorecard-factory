# The risk scorecard's mechanics. Platform-owned: Gate 1, the review agent, registry limits and central review.
# What gets routed to a person, and why, is in routing.toml (security-owned). Every change is a reviewed pull request.
schema: scorecard-config/v2

# Gate 1 must be green on the PR head before anything is assessed. App 15368 is GitHub Actions. Keep this list to
# drift and preview plus every entry of the platform's required-checks.json (the scans), pinned to the same sources.
gate1_checks:
  - {name: "golden-road / drift", app_id: 15368}
  - {name: "golden-road / preview", app_id: 15368}
  - {"name":"security-scans / semgrep","app_id":15368}
  - {"name":"security-scans / trivy","app_id":15368}
  - {"name":"Analyze (python)","app_id":15368}
  - {"name":"Analyze (actions)","app_id":15368}
drift_check: "golden-road / drift"

registry: {timeout_seconds: 10, max_total_seconds: 120}

# The review agent. `scorecard run` refuses an assessment made with any other model version, prompt version or questions.
# The model name the gateway expects is the SCORECARD_GATEWAY_MODEL secret. Raise model.version whenever it changes.
# The budget bounds one review: a review that runs out fails closed (T-14), instead of running for hours.
agent:
  prompt_version: review-2
  model: {version: "opus-5-pinned-1", temperature: null}
  gateway:
    url: "https://llm.mwdavisii.com/v1/chat/completions"
    auth: {scheme: bearer}
    credential_env: SCORECARD_GATEWAY_TOKEN
    timeout_seconds: 120
    retry_seconds: 5
    max_response_bytes: 2000000
  budget: {max_total_tokens: 600000, max_tokens_per_call: 16384, max_run_seconds: 900}
  batching: {max_requirements: 12, max_turns: 40}
  tools: {max_read_lines: 400, max_output_chars: 24000, max_grep_matches: 100, max_list_files: 500, max_diff_chars: 60000}
central: {max_in_flight: 4, assess_timeout_minutes: 360}
